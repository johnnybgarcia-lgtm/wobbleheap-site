.block { display: block; }

.rs-bdfade { animation: rs-bdin 1.4s ease-out both; }
@keyframes rs-bdin { from { opacity: 0 } to { opacity: 1 } }

.rs-petal { animation-name: rs-drift; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes rs-drift {
  0%   { transform: translate3d(0,-20px,0) rotate(0deg); opacity: 0 }
  8%   { opacity: .45 }
  50%  { transform: translate3d(26px,52vh,0) rotate(180deg) }
  92%  { opacity: .35 }
  100% { transform: translate3d(-14px,106vh,0) rotate(360deg); opacity: 0 }
}

/* a finished row, column or station lights up */
.rs-spark { animation: rs-glow .76s ease-out; }
@keyframes rs-glow {
  0%   { box-shadow: inset 0 0 0 0 rgba(255,226,150,0); }
  25%  { box-shadow: inset 0 0 22px 4px rgba(255,214,110,0.95); }

  12%  { opacity: 1; transform: translate(-50%,-50%) scale(1) }
  78%  { opacity: 1; transform: translate(-50%,-50%) scale(1) }
